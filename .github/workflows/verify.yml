name: Production Trust Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  trust-gate:
    name: Production Trust Gate Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Stage 1 - Mock Rot & In-Memory Cheat Scan
        run: npm run verify:trust

      - name: Stage 2 - Database Contract Alignment Audit
        run: npm run verify:contracts

      - name: Stage 3 - Migration Sync & Safety Audit
        run: npm run verify:migrations

      - name: Stage 4 - TypeScript Strict Compilation
        run: npm run typecheck

      - name: Stage 5 - Vitest Unit & Domain Test Suite
        run: npm test
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock

      - name: Stage 6 - Production Bundle Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock
